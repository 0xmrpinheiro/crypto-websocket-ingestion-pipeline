x-pipeline: &pipeline
  image: ${COMPOSE_PROJECT_NAME:-crypto-websocket-ingestion-pipeline}-app:local
  build:
    context: .
    dockerfile: docker/Dockerfile

services:
  kafka:
    image: apache/kafka:3.9.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, kafka:29092, --list]
      interval: 5s
      timeout: 10s
      retries: 20

  topics:
    image: apache/kafka:3.9.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [/bin/bash, /create_topics.sh]
    volumes:
      - ./scripts/create_topics.sh:/create_topics.sh:ro

  postgres:
    image: postgres:16.13-bookworm
    environment:
      POSTGRES_DB: crypto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d crypto"]
      interval: 3s
      timeout: 5s
      retries: 20

  replay:
    <<: *pipeline
    command: [replay_ws]

  collector:
    <<: *pipeline
    command: [crypto-collector]
    depends_on:
      topics:
        condition: service_completed_successfully
      replay:
        condition: service_started
    environment:
      COLLECTOR__KAFKA_BROKERS: kafka:29092
      COLLECTOR__BINANCE_BASE_URL: ${COLLECTOR__BINANCE_BASE_URL:-ws://replay:8080}
    ports:
      - "127.0.0.1:9090:9090"

  processor:
    <<: *pipeline
    command: [crypto-processor]
    depends_on:
      topics:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      PROCESSOR__KAFKA_BROKERS: kafka:29092
      PROCESSOR__POSTGRES_URL: postgresql://postgres:password@postgres:5432/crypto
    ports:
      - "127.0.0.1:9091:9091"

volumes:
  kafka-data:
  postgres-data: