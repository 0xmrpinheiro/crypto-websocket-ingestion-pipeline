[workspace]
resolver = "2"
members = ["crates/shared", "crates/collector", "crates/processor"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/example/crypto-websocket-ingestion-pipeline"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
moka = { version = "0.12", features = ["future"] }
rdkafka = { version = "0.34", features = ["tokio", "libz", "cmake-build"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "uuid"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
prometheus = { version = "0.13", default-features = false }
axum = { version = "0.7", features = ["json", "tokio"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls"] }
tungstenite = { version = "0.21", features = ["rustls-tls-webpki-client"] }
rustls = { version = "0.23", default-features = false, features = ["tls12", "aws-lc"] }
tokio-rustls = "0.26"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
url = "2.5"
futures = "0.3"
async-trait = "0.1"
anyhow = "1.0"
config = "0.14"
dashmap = "6.0"
parking_lot = "0.12"